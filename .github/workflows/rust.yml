name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Cargo Fmt
        run: cargo fmt --all -- --check

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: ['stable', '1.85']

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3
    - name: Install toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        override: true
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: |
        cargo test --verbose
        cargo test --verbose --features tokio
        cargo test --verbose --features smol
        cargo test --verbose --features smol,tokio

  check:
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - wasm32-unknown-unknown
        build-std:
          - no
        include:
          - target: i686-win7-windows-gnu
            build-std: yes
          - target: x86_64-win7-windows-gnu
            build-std: yes
    name: 'check (${{ matrix.target }})'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - if: ${{ matrix.build-std == 'no' }}
      name: Install toolchain (stable)
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - if: ${{ matrix.build-std == 'yes' }}
      name: Install toolchain (nightly)
      uses: dtolnay/rust-toolchain@nightly
      with:
        targets: x86_64-unknown-linux-gnu
        components: rust-src
    - name: check
      run: |
        cargo check ${{ matrix.build-std == 'yes' && '-Zbuild-std' || '' }} --target ${{ matrix.target }}
        cargo check ${{ matrix.build-std == 'yes' && '-Zbuild-std' || '' }} --target ${{ matrix.target }} --features tokio
        cargo check ${{ matrix.build-std == 'yes' && '-Zbuild-std' || '' }} --target ${{ matrix.target }} --features smol
        cargo check ${{ matrix.build-std == 'yes' && '-Zbuild-std' || '' }} --target ${{ matrix.target }} --all-features

  fuzz:
    runs-on: ubuntu-latest
    env:
      CARGO_FUZZ_VERSION: 0.13.2
      FUZZ_TIME: 15
    steps:
    - uses: actions/checkout@v4
    - name: Install toolchain
      uses: dtolnay/rust-toolchain@nightly
    - uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/cargo-fuzz
        key: cargo-fuzz-bin-${{ env.CARGO_FUZZ_VERSION }}
    - run: echo "${{ runner.tool_cache }}/cargo-fuzz/bin" >> $GITHUB_PATH
    - run: cargo install --root "${{ runner.tool_cache }}/cargo-fuzz" --version ${{ env.CARGO_FUZZ_VERSION }} cargo-fuzz --locked
    - run: cp -rT fuzz/seed fuzz/corpus
    - run: cargo fuzz run descriptors -- -max_total_time=${{ env.FUZZ_TIME }}
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: fuzzing-artifacts
        path: fuzz/artifacts

  rustdoc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install toolchain
      uses: dtolnay/rust-toolchain@nightly
    - name: rustdoc
      run: RUSTDOCFLAGS=--cfg=docsrs cargo +nightly doc --all-features --no-deps
